[package]
name = "rootle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Modal TUI for browsing remote source-control systems from the terminal"
readme = "../../README.md"
keywords = ["tui", "github", "terminal", "git", "browser"]
categories = ["command-line-utilities"]
exclude = ["/tests"]

[dependencies]
rootle-provider.workspace = true
rootle-stdio.workspace = true
rootle-github.workspace = true
rootle-manager.workspace = true
rootle-diff.workspace = true
rootle-trace.workspace = true
ratatui = { version = "0.30", features = [] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1"
unicode-width = "0.2"
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
# Grammar crates: parsers + queries are compiled into the binary
# (statically linked C, no runtime downloads, no dlopen).
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-lua = "0.5"
tree-sitter-md = "0.5"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
base64 = "0.23.1"
sha2 = "0.11"
signal-hook = "0.4"
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.9"
tar = "0.4.46"
sha1 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
wiremock = "0.6"
