# request kernel: the Lean 4 proof project over the Charon/Aeneas translation of
# crates/kernel. Built only inside the `proofs` compose image, where
# `aeneas` is the pinned release unpacked at /opt/aeneas (proofs/Dockerfile);
# lake-manifest.json pins mathlib and the rest of the dependency graph.
name = "rootle-proofs"
defaultTargets = ["Extracted", "Kernel", "Audit"]

[[require]]
name = "aeneas"
path = "/opt/aeneas/backends/lean"

# Generated by proofs/extract.sh and committed; the gate refuses drift.
[[lean_lib]]
name = "Extracted"
globs = ["Extracted.+"]

# The theorems, stated over the extracted functions.
[[lean_lib]]
name = "Kernel"

# Every theorem's axioms, printed and checked against Lean's standard three.
[[lean_lib]]
name = "Audit"
roots = ["Audit"]
