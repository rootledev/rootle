name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Two tags cut at once race the homebrew-tap push — serialize; the
# newer tag waits (the gripsack lesson).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # One supported artifact target: Linux/WSL x86_64, statically linked musl.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build (linux musl, docker)
        run: |
          docker compose run --build --rm \
            -e "VERSION=${GITHUB_REF_NAME#v}" \
            release

      # Shared pilot/Actions contract: exact inventory, checksum, static ELF,
      # version, headless lifecycle, installer and full real-binary PTY/e2e suite.
      - name: Verify artifact and installed consumers
        run: |
          docker compose run --build --rm artifact \
            uv run --locked --no-sync python /app/.ci/qualify_release.py \
            --dist /dist --consumer --version "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-x86_64-unknown-linux-musl
          path: |
            dist/rootle-*-x86_64-unknown-linux-musl.tar.gz
            dist/rootle-*-x86_64-unknown-linux-musl.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestation (plans/0023 M2, the gripsack
      # pattern) — sigstore signing needs an identity token.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist-x86_64-unknown-linux-musl
          path: dist

      - name: Verify exact Linux x64 artifact inventory
        run: python3 .ci/qualify_release.py --inventory-only --version "${GITHUB_REF_NAME#v}"

      # Attest build provenance for every tarball (the gripsack
      # pattern): verifiable with
      # `gh attestation verify <tarball> -R rootledev/rootle`.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/rootle-*.tar.gz

      # crates.io before the GitHub release: it is the irreversible
      # artifact. The guard fails a mistagged release instead of
      # publishing the wrong version.
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Workspace crates share one version (workspace.package);
          # every one of them must match the tag or the release stops
          # before the irreversible artifact.
          versions="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].version' | sort -u)"
          test "$(printf '%s\n' "$versions" | wc -l)" -eq 1 || {
            echo "::error::workspace crates carry differing versions"; exit 1; }
          test "v$versions" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME != crate version v$versions"; exit 1; }
          # Sink and vocabulary precede implementations; the app comes last.
          for crate in rootle-trace rootle-provider rootle-diff rootle-stdio rootle-github rootle-manager rootle; do
            cargo publish -p "$crate"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/* \
            --title "rootle $tag" \
            --generate-notes

      # Source formula is Linux x86_64 only; no active macOS cask.
      # Needs HOMEBREW_TAP_TOKEN (PAT, contents:write on the tap repo).
      - name: Bump homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          sha="$(curl -fsSL "https://static.crates.io/crates/rootle/rootle-$ver.crate" | sha256sum | cut -d' ' -f1)"
          gh repo clone rootledev/homebrew-tap /tmp/tap -- --depth 1
          sed -i -e "s|rootle-[0-9.]*\.crate|rootle-$ver.crate|" \
                 -e "s|sha256 \"[0-9a-f]*\"|sha256 \"$sha\"|" \
                 /tmp/tap/Formula/rootle.rb
          cd /tmp/tap
          # gh clones without persisting push credentials — authenticate
          # the remote explicitly or `git push` fails with exit 128.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/rootledev/homebrew-tap.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rootle.rb
          git commit -m "rootle $ver"
          git push

      # Redeploy the site so the landing's version chip and install.sh
      # pick up the release (the site stamps both from this repo's
      # main). Best-effort: a site hiccup must not fail the release.
      - name: Redeploy website
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          gh api -X POST repos/rootledev/rootledev.github.io/dispatches \
            -f event_type=rebuild \
            -f 'client_payload[reason]="release '"${GITHUB_REF_NAME}"'"'
