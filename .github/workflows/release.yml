name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Two tags cut at once race the homebrew-tap push — serialize; the
# newer tag waits (the gripsack lesson).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Per-platform binaries: linux + macOS, both arches (Windows is out
  # by design — WSL is the story there). The docker musl path needs no
  # cross config: rust:alpine is multi-arch, so the same compose build
  # produces aarch64 musl natively on the arm runner. macOS builds
  # natively on matching runners.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, docker: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, docker: true }
          # both darwin targets on the arm runner — x86_64 cross-compiles
          # with the stock Xcode (no macos-13 queue, which can idle 20-60min)
          - { target: x86_64-apple-darwin, runner: macos-14, cross: true }
          - { target: aarch64-apple-darwin, runner: macos-14 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Build (linux musl, docker)
        if: matrix.docker
        run: |
          docker compose run --build --rm \
            -e "VERSION=${GITHUB_REF_NAME#v}" \
            -e "TARGET=${{ matrix.target }}" release

      - name: Build (macOS, native)
        if: ${{ !matrix.docker }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="rootle-$VERSION-${{ matrix.target }}"
          staging="$(mktemp -d)"
          mkdir -p "$staging/$PKG"
          install -m755 "target/${{ matrix.target }}/release/rootle" "$staging/$PKG/rootle"
          mkdir -p dist
          tar -czf "dist/$PKG.tar.gz" -C "$staging" "$PKG"
          (cd dist && shasum -a 256 "$PKG.tar.gz" > "$PKG.tar.gz.sha256")

      # Smoke: prove the tarball extracts to a runnable binary and the
      # published checksum matches. Linux must be fully static; macOS
      # may link system libs only.
      - name: "Verify (linux: fully static)"
        if: matrix.docker
        run: |
          cd dist
          sha256sum -c rootle-*.tar.gz.sha256
          tmp="$(mktemp -d)"
          tar -xzf rootle-*-${{ matrix.target }}.tar.gz -C "$tmp"
          bin="$(find "$tmp" -type f -name rootle | head -1)"
          file "$bin"
          ! ldd "$bin" 2>&1 | grep -q "=>"
          "$bin" --version

      - name: "Verify (macOS: system libs only)"
        if: ${{ !matrix.docker }}
        run: |
          cd dist
          shasum -a 256 -c rootle-*.tar.gz.sha256
          tmp="$(mktemp -d)"
          tar -xzf rootle-*-${{ matrix.target }}.tar.gz -C "$tmp"
          bin="$(find "$tmp" -type f -name rootle | head -1)"
          file "$bin"
          otool -L "$bin"
          ! otool -L "$bin" | grep -qvE "libSystem|libiconv|CoreFoundation|Security|SystemConfiguration"
          "$bin" --version

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Verify all four platform tarballs are present
        run: |
          ls -la dist/
          count="$(ls dist/rootle-*.tar.gz | wc -l)"
          test "$count" -eq 4 || {
            echo "::error::expected 4 platform tarballs, got $count"; exit 1; }

      # crates.io before the GitHub release: it is the irreversible
      # artifact. The guard fails a mistagged release instead of
      # publishing the wrong version.
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          pkg="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "v$pkg" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME != crate version v$pkg"; exit 1; }
          cargo publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/* \
            --title "rootle $tag" \
            --generate-notes

      # Keep the tap in sync, both halves:
      # - Formula/rootle.rb builds from the crate (linux brew / source
      #   people)
      # - Casks/rootle.rb installs the prebuilt per-arch macOS binaries
      #   (no rust toolchain on the user's machine — the better macOS
      #   path; arm + intel sha256 pairs from this release's tarballs)
      # Needs HOMEBREW_TAP_TOKEN (PAT, contents:write on the tap repo) —
      # GITHUB_TOKEN is repo-scoped and can't push to homebrew-tap.
      - name: Bump homebrew formula + cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          sha="$(curl -fsSL "https://static.crates.io/crates/rootle/rootle-$ver.crate" | sha256sum | cut -d' ' -f1)"
          gh repo clone rootledev/homebrew-tap /tmp/tap -- --depth 1
          sed -i -e "s|rootle-[0-9.]*\.crate|rootle-$ver.crate|" \
                 -e "s|sha256 \"[0-9a-f]*\"|sha256 \"$sha\"|" \
                 /tmp/tap/Formula/rootle.rb
          mkdir -p /tmp/tap/Casks
          sha_arm="$(cut -d' ' -f1 "dist/rootle-$ver-aarch64-apple-darwin.tar.gz.sha256")"
          sha_x64="$(cut -d' ' -f1 "dist/rootle-$ver-x86_64-apple-darwin.tar.gz.sha256")"
          cat > /tmp/tap/Casks/rootle.rb <<EOF
          cask "rootle" do
            version "$ver"

            arch arm: "aarch64", intel: "x86_64"
            sha256 arm: "$sha_arm", intel: "$sha_x64"

            url "https://github.com/rootledev/rootle/releases/download/v#{version}/rootle-#{version}-#{arch}-apple-darwin.tar.gz"
            name "rootle"
            desc "modal TUI for browsing remote source-control systems from the terminal"
            homepage "https://rootle.dev"

            binary "rootle-#{version}-#{arch}-apple-darwin/rootle"
          end
          EOF
          cd /tmp/tap
          # gh clones without persisting push credentials — authenticate
          # the remote explicitly or `git push` fails with exit 128.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/rootledev/homebrew-tap.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rootle.rb Casks/rootle.rb
          git commit -m "rootle $ver"
          git push

      # Redeploy the site so the landing's version chip and install.sh
      # pick up the release (the site stamps both from this repo's
      # main). Best-effort: a site hiccup must not fail the release.
      - name: Redeploy website
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          gh api -X POST repos/rootledev/rootledev.github.io/dispatches \
            -f event_type=rebuild \
            -f 'client_payload[reason]="release '"${GITHUB_REF_NAME}"'"'
