name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build static musl binary
        run: docker compose run --build --rm -e "VERSION=${GITHUB_REF_NAME#v}" release

      # Smoke: prove the tarball extracts to a static, runnable binary
      # and the published checksum matches.
      - name: Verify binary
        run: |
          cd dist
          sha256sum -c rootle-*.tar.gz.sha256
          tmp="$(mktemp -d)"
          tar -xzf rootle-*-x86_64-unknown-linux-musl.tar.gz -C "$tmp"
          bin="$(find "$tmp" -type f -name rootle | head -1)"
          file "$bin"
          ! ldd "$bin" 2>&1 | grep -q "=>"
          "$bin" --version

      # crates.io before the GitHub release: it is the irreversible
      # artifact. The guard fails a mistagged release instead of
      # publishing the wrong version.
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          pkg="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "v$pkg" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME != crate version v$pkg"; exit 1; }
          cargo publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/* \
            --title "rootle $tag" \
            --generate-notes

      # Keep the tap in sync: bump the formula's version + crate sha256.
      # Needs HOMEBREW_TAP_TOKEN (PAT, contents:write on the tap repo) —
      # GITHUB_TOKEN is repo-scoped and can't push to homebrew-tap.
      - name: Bump homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          sha="$(curl -fsSL "https://static.crates.io/crates/rootle/rootle-$ver.crate" | sha256sum | cut -d' ' -f1)"
          gh repo clone rootledev/homebrew-tap /tmp/tap -- --depth 1
          sed -i -e "s|rootle-[0-9.]*\.crate|rootle-$ver.crate|" \
                 -e "s|sha256 \"[0-9a-f]*\"|sha256 \"$sha\"|" \
                 /tmp/tap/Formula/rootle.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "rootle $ver"
          git push
