name: pages

# Project website at rootle.dev — assembled by
# website/build.py: the landing page from website/, the docs pages
# converted from doc/*.md, and the rendered demo artifacts. Editing a
# doc in the repo is all it takes to update the site.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "install.sh"
      - "doc/*.md"
      - "doc/logo.svg"
      - "doc/demo.gif"
      - "doc/img/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Build site
        run: uv run --with markdown python website/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v5
