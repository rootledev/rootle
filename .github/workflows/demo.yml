name: demo

# Re-render the demo GIFs whenever the app or the demo tooling changes —
# README and the website always show the current look. One render per
# embedded palette: catppuccin-mocha is the canonical doc/demo.gif
# (README hero); the rest land in doc/img/demo-<theme>.gif for the
# site's palette picker.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "demos/**"
      - "e2e/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: write
  pull-requests: write

jobs:
  # The release service requires VERSION; the tape only needs the binary
  # inside the tarball (demo_setup.sh extracts it, in the VHS container).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build binary for the tape
        run: docker compose run --build --rm -e VERSION=0.0.0-demo release

      - uses: actions/upload-artifact@v7
        with:
          name: release-tarball
          path: dist/*.tar.gz

  # One parallel job per palette — sequential rendering took ~2 min per
  # theme; the matrix keeps the wall clock at one render. The tape is
  # sed-parameterized per theme: Output path + --theme on the launch line.
  render:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme:
          - catppuccin-mocha
          - dracula
          - gruvbox-dark
          - nord
          - one-dark
          - solarized-dark
          - tokyo-night
          - catppuccin-latte
          - github-light
          - one-light
          - solarized-light
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-tarball
          path: dist

      - name: Render demo GIF (${{ matrix.theme }})
        env:
          THEME: ${{ matrix.theme }}
        run: |
          out="doc/demo.gif"
          [ "$THEME" = "catppuccin-mocha" ] || out="doc/img/demo-$THEME.gif"
          # VHS paints the window remainder (rows×cell < Height) with the
          # tape theme's background — map each palette to its VHS theme
          # or light renders get a dark band.
          case "$THEME" in
            catppuccin-mocha)  vhs_theme="Catppuccin Mocha" ;;
            dracula)           vhs_theme="Dracula" ;;
            gruvbox-dark)      vhs_theme="GruvboxDark" ;;
            nord)              vhs_theme="nord" ;;
            one-dark)          vhs_theme="OneDark" ;;
            solarized-dark)    vhs_theme="Builtin Solarized Dark" ;;
            tokyo-night)       vhs_theme="TokyoNight" ;;
            catppuccin-latte)  vhs_theme="Catppuccin Latte" ;;
            github-light)      vhs_theme="Github" ;;
            one-light)         vhs_theme="AtomOneLight" ;;
            solarized-light)   vhs_theme="Builtin Solarized Light" ;;
          esac
          sed -e "s|^Output .*|Output $out|" \
              -e "s|^Set Theme .*|Set Theme \"$vhs_theme\"|" \
              -e "s|--config /tmp/rootle-demo/provider.toml|--theme $THEME --config /tmp/rootle-demo/provider.toml|" \
              demos/demo.tape > "demos/.tape-$THEME"
          # VHS resolves fonts via fontconfig: install the vendored
          # JetBrains Mono into the container first.
          docker run --rm -v "$PWD:/vhs" -w /vhs --entrypoint sh ghcr.io/charmbracelet/vhs -c \
            "mkdir -p /usr/share/fonts/truetype/jbmono && \
             cp /vhs/demos/fonts/JetBrainsMono-*.ttf /usr/share/fonts/truetype/jbmono/ && \
             fc-cache -f >/dev/null 2>&1; exec vhs /vhs/demos/.tape-$THEME"
          rm "demos/.tape-$THEME"

      - uses: actions/upload-artifact@v7
        with:
          name: demo-gif-${{ matrix.theme }}
          # Exactly the file this job rendered — globbing doc/demo.gif
          # here would also match the committed (stale) one and race the
          # canonical GIF in the merged download.
          path: ${{ matrix.theme == 'catppuccin-mocha' && 'doc/demo.gif' || format('doc/img/demo-{0}.gif', matrix.theme) }}
          if-no-files-found: error

  publish:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: demo-gif-*
          path: /tmp/gifs
          merge-multiple: true

      - name: Place GIFs
        # download-artifact may keep directory structure under the
        # merged dir; copy by basename regardless of layout.
        run: |
          mkdir -p doc/img
          find /tmp/gifs -name '*.gif' | while read -r f; do
            base="$(basename "$f")"
            if [ "$base" = "demo.gif" ]; then
              cp "$f" doc/demo.gif
            else
              cp "$f" "doc/img/$base"
            fi
          done
          ls -la doc/demo.gif doc/img/

      # Idempotent: an unchanged render commits nothing, so this never
      # loops. main is protected, so changed artifacts land as a PR on
      # a fixed branch (force-pushed, one open PR at a time) instead of
      # a direct push. The PR is reused — every render rewrites the body
      # with the source SHA so it never looks stale; the [bot] marker in
      # the title makes its provenance unambiguous.
      - name: Open artifacts PR if renders changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/demo.gif doc/img/
          git diff --cached --quiet && exit 0
          changed="$(git diff --cached --name-only | sed 's/^/- /')"
          git checkout -B demo/artifacts
          git commit -m "docs: refresh demo GIFs"
          git push -f origin demo/artifacts
          title="chore(demo): refresh demo GIFs [bot]"
          body="Re-rendered demo artifacts from the demo workflow.

          - rendered from: \`main@${GITHUB_SHA:0:8}\`
          - at: $(date -u '+%Y-%m-%d %H:%M UTC')

          $changed

          Docs-only: bot PRs don't trigger CI (GITHUB_TOKEN), so merge with the
          admin override. This PR is reused: every render force-pushes the
          demo/artifacts branch and rewrites this body."
          if gh pr view demo/artifacts --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit demo/artifacts --title "$title" --body "$body"
          else
            gh pr create --base main --head demo/artifacts --title "$title" --body "$body"
          fi
