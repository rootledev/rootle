name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build gate (fmt, clippy, tests)
        run: docker compose run --build --rm test

      # PTY e2e suite (pyte screen reconstruction) in the same image —
      # offline: the fs stdio provider backs all flows, no network.
      - name: E2E (PTY suite)
        run: docker compose run --build --rm e2e

      # The provider protocol, model-checked with TLC (plans/0027):
      # base spec clean AND the kept mutant killed by name — the
      # bridge tests in crates/stdio hold the code to the same faults.
      - name: Provider protocol model (TLC)
        run: docker compose run --build --rm model

      # The pinned Charon/Aeneas/Lean toolchain is qualified on local Buildbot
      # (the mandatory proofs gate in .ci/pilot.json), not a disk-limited hosted runner.

  # plans/0015: the canonical conformance suite gates the reference
  # adapter — protocol changes must keep fs_provider.py green.
  forge-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: rootledev/forge-conformance
          ref: 75c00748f6927e45ec23d42642ee96d96a787648
          path: forge-conformance
      - uses: actions/setup-python@v7
      - name: Conformance suite vs the fs reference provider
        run: |
          python3 -m pip install pytest
          # `run` chdirs into the suite root — the provider path must
          # be absolute.
          python3 forge-conformance/run -- python3 "$GITHUB_WORKSPACE/crates/stdio/examples/fs_provider.py"
