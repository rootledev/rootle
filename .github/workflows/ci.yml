name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build gate (fmt, clippy, tests)
        run: docker compose run --build --rm test

      # PTY e2e suite (pyte screen reconstruction) in the same image —
      # offline: the fs stdio provider backs all flows, no network.
      - name: E2E (PTY suite)
        run: docker compose run --build --rm e2e

  # plans/0023 M3: behavioral coverage on real macOS — APFS
  # case-insensitivity, symlink topology, BSD-flavored crossterm
  # edges. Native, not docker: macOS runners have no compose story
  # worth the latency (the gripsack lesson). Offline, same fs
  # provider fixtures as the docker suite.
  e2e-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      # The suite builds the debug binary itself (e2e/tui.py build()).
      - name: Build debug binary
        run: cargo build --locked

      - uses: astral-sh/setup-uv@v7

      # uv, not pip: homebrew's python is PEP-668 externally-managed.
      - name: E2E (headless + PTY suite)
        working-directory: e2e
        run: uv run pytest

  # plans/0015: the canonical conformance suite gates the reference
  # adapter — protocol changes must keep fs_provider.py green.
  forge-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: rootledev/forge-conformance
          path: forge-conformance
      - uses: actions/setup-python@v7
      - name: Conformance suite vs the fs reference provider
        run: |
          python3 -m pip install pytest
          # `run` chdirs into the suite root — the provider path must
          # be absolute.
          python3 forge-conformance/run -- python3 "$GITHUB_WORKSPACE/examples/providers/fs_provider.py"
