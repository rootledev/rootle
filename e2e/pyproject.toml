[project]
name = "ghx-e2e"
version = "0.1.0"
description = "End-to-end PTY harness + tests for the ghx TUI"
requires-python = ">=3.10"
dependencies = [
    "pyte>=0.8.2",
    "pytest>=8.0",
    "pillow>=11",
    "fonttools>=4.63.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-q"

[tool.uv]
package = false
