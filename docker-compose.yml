# Always run gates with --build. Release platforms are native musl images;
# an amd64 host needs registered arm64 binfmt/QEMU or an arm64 Docker worker.
services:
  test:
    build:
      context: .
      target: test
    command: 'echo "gate passed: fmt + clippy + tests"'
  audit:
    build:
      context: .
      target: audit
    command: 'echo "gate passed: pinned RustSec audit"'
  model:
    build:
      context: .
      target: model
    command: 'echo "gate passed: provider protocol model"'
  proofs:
    platform: linux/amd64
    build:
      context: .
      dockerfile: proofs/Dockerfile
      target: gate
  build:
    build:
      context: .
      target: test
    command: /app/target/debug/rootle --version
  e2e:
    build:
      context: .
      target: e2e
  release:
    platform: ${ROOTLE_PLATFORM:-linux/amd64}
    build:
      context: .
      target: release
    environment:
      - VERSION
      - TARGET
      - SOURCE_DATE_EPOCH
    volumes:
      - ${ROOTLE_DIST:-./dist}:/dist
