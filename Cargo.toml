[package]
name = "ghx"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ghx"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", features = [] }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
unicode-width = "0.2"
serde_json = "1.0.151"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy", "default-syntaxes"] }
base64 = "0.23.1"
filetime = "0.2.29"
clap = { version = "4.6.6", features = ["derive"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
