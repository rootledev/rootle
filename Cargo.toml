[workspace]
members = ["crates/provider", "crates/stdio", "crates/github", "crates/manager"]
resolver = "2"

[workspace.package]
version = "0.9.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/rootledev/rootle"

[package]
name = "rootle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Modal TUI for browsing remote source-control systems (GitHub in-tree, any forge via stdio providers) from the terminal"
readme = "README.md"
keywords = ["tui", "github", "terminal", "git", "browser"]
categories = ["command-line-utilities"]
# The crate ships source + README + LICENSE only; contributor docs,
# harnesses and agent tooling stay in the repo (the website and demo
# GIFs live in rootledev/rootledev.github.io).
exclude = [
    "/.agents",
    "/.github",
    "/crates",
    "/demos",
    "/doc",
    "/e2e",
    "/plans",
    "/specs",
    "/skills",
    "/Dockerfile",
    "/docker-compose.yml",
    "/install.sh",
    "/PLAN.md",
    "/AGENTS.md",
]

[lib]
path = "src/lib.rs"

[[bin]]
name = "rootle"
path = "src/main.rs"

[dependencies]
rootle-provider = { path = "crates/provider", version = "=0.9.3" }
rootle-stdio = { path = "crates/stdio", version = "=0.9.3" }
rootle-github = { path = "crates/github", version = "=0.9.3" }
rootle-manager = { path = "crates/manager", version = "=0.9.3" }
ratatui = { version = "0.30", features = [] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1"
unicode-width = "0.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy", "default-syntaxes"] }
base64 = "0.23.1"
sha2 = "0.11"
signal-hook = "0.4"
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.9"
tar = "0.4.46"
sha1 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
wiremock = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
