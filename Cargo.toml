[package]
name = "rootle"
version = "0.9.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Modal TUI for browsing remote source-control systems (GitHub in-tree, any forge via stdio providers) from the terminal"
repository = "https://github.com/rootledev/rootle"
readme = "README.md"
keywords = ["tui", "github", "terminal", "git", "browser"]
categories = ["command-line-utilities"]
# The crate ships source + README + LICENSE only; contributor docs,
# harnesses and agent tooling stay in the repo (the website and demo
# GIFs live in rootledev/rootledev.github.io).
exclude = [
    "/.agents",
    "/.github",
    "/demos",
    "/doc",
    "/e2e",
    "/plans",
    "/skills",
    "/Dockerfile",
    "/docker-compose.yml",
    "/install.sh",
    "/PLAN.md",
    "/AGENTS.md",
]

[lib]
path = "src/lib.rs"

[[bin]]
name = "rootle"
path = "src/main.rs"

[dependencies]
parking_lot = "0.12"
ratatui = { version = "0.30", features = [] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "6"
unicode-width = "0.2"
serde_json = "1.0.151"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy", "default-syntaxes"] }
base64 = "0.23.1"
sha2 = "0.11"
signal-hook = "0.4"
filetime = "0.2.29"
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.9"
tar = "0.4.46"
thiserror = "2.0.20"
sha1 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
wiremock = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
