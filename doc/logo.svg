<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" font-family="DejaVu Sans Mono, monospace">
  <!-- rootle logo: the miller-column browser as a terminal card with the
       rootle mole peeking over the edge. Catppuccin Mocha; dark backdrop
       keeps the wordmark legible on GitHub's light theme too. -->
  <rect width="480" height="310" rx="18" fill="#11111b"/>
  <!-- terminal card -->
  <rect x="24" y="52" width="432" height="196" rx="14" fill="#1e1e2e" stroke="#585b70" stroke-width="2"/>
  <!-- window chrome -->
  <circle cx="44" cy="70" r="4" fill="#f38ba8" opacity="0.9"/>
  <circle cx="60" cy="70" r="4" fill="#f9e2af" opacity="0.9"/>
  <circle cx="76" cy="70" r="4" fill="#a6e3a1" opacity="0.9"/>
  <!-- panes: orgs (dim) · repo (focused, soft glow) · preview -->
  <rect x="40" y="84" width="88" height="140" rx="8" fill="none" stroke="#585b70" stroke-width="1.5"/>
  <rect x="136" y="84" width="128" height="140" rx="8" fill="none" stroke="#89b4fa" stroke-width="7" opacity="0.15"/>
  <rect x="136" y="84" width="128" height="140" rx="8" fill="none" stroke="#89b4fa" stroke-width="2.5"/>
  <rect x="272" y="84" width="168" height="140" rx="8" fill="none" stroke="#585b70" stroke-width="1.5"/>
  <!-- orgs pane entries -->
  <rect x="52" y="100" width="52" height="8" rx="3" fill="#585b70"/>
  <rect x="52" y="120" width="60" height="8" rx="3" fill="#585b70"/>
  <rect x="52" y="140" width="44" height="8" rx="3" fill="#585b70"/>
  <!-- repo pane entries with a selected row (▌ gutter + selection bg) -->
  <rect x="148" y="100" width="68" height="8" rx="3" fill="#a6adc8"/>
  <rect x="148" y="116" width="108" height="18" rx="4" fill="#313244"/>
  <rect x="150" y="120" width="4" height="10" fill="#89b4fa"/>
  <rect x="157" y="121" width="84" height="8" rx="3" fill="#89b4fa"/>
  <rect x="148" y="142" width="76" height="8" rx="3" fill="#a6adc8"/>
  <rect x="148" y="162" width="92" height="8" rx="3" fill="#a6adc8"/>
  <!-- scrollbar: track on the right border, thumb accent -->
  <rect x="259" y="98" width="3" height="112" rx="1.5" fill="#313244"/>
  <rect x="259" y="114" width="3" height="32" rx="1.5" fill="#89b4fa"/>
  <!-- preview pane: syntax-colored code lines + a grep match chip -->
  <rect x="284" y="100" width="18" height="7" rx="3" fill="#cba6f7"/>
  <rect x="306" y="100" width="44" height="7" rx="3" fill="#89b4fa"/>
  <rect x="354" y="100" width="36" height="7" rx="3" fill="#a6adc8"/>
  <rect x="284" y="116" width="30" height="7" rx="3" fill="#94e2d5"/>
  <rect x="318" y="116" width="54" height="7" rx="3" fill="#a6e3a1"/>
  <rect x="376" y="116" width="28" height="7" rx="3" fill="#a6adc8"/>
  <rect x="284" y="132" width="34" height="9" rx="2" fill="#f9e2af"/>
  <rect x="324" y="133" width="80" height="7" rx="3" fill="#a6adc8"/>
  <rect x="284" y="148" width="22" height="7" rx="3" fill="#f38ba8"/>
  <rect x="310" y="148" width="64" height="7" rx="3" fill="#a6adc8"/>
  <rect x="378" y="148" width="34" height="7" rx="3" fill="#cba6f7"/>
  <rect x="284" y="164" width="96" height="7" rx="3" fill="#a6adc8"/>
  <rect x="284" y="180" width="64" height="7" rx="3" fill="#a6adc8"/>
  <!-- modeline: bar + green mode chip + context hints -->
  <rect x="26" y="228" width="428" height="18" rx="9" fill="#181825"/>
  <rect x="34" y="231" width="64" height="12" rx="4" fill="#a6e3a1"/>
  <rect x="110" y="234" width="190" height="6" rx="3" fill="#6c7086"/>
  <rect x="372" y="236" width="28" height="4" rx="2" fill="#45475a"/>
  <rect x="406" y="236" width="40" height="4" rx="2" fill="#45475a"/>
  <!-- the rootle mole: peeking over the card, paws on the edge -->
  <g transform="translate(-5,0)">
    <circle cx="399" cy="30" r="6.5" fill="#fab387"/>
    <circle cx="399" cy="30" r="3" fill="#eba0ac"/>
    <circle cx="429" cy="30" r="6.5" fill="#fab387"/>
    <circle cx="429" cy="30" r="3" fill="#eba0ac"/>
    <ellipse cx="414" cy="49" rx="25" ry="21" fill="#fab387"/>
    <circle cx="405" cy="44" r="2.6" fill="#11111b"/>
    <circle cx="423" cy="44" r="2.6" fill="#11111b"/>
    <circle cx="404.2" cy="43.2" r="0.8" fill="#fff5ee"/>
    <circle cx="422.2" cy="43.2" r="0.8" fill="#fff5ee"/>
    <ellipse cx="414" cy="57" rx="10" ry="7" fill="#fbd3bb"/>
    <ellipse cx="414" cy="54.5" rx="4" ry="3" fill="#f38ba8"/>
    <g stroke="#e0a080" stroke-width="1.3" stroke-linecap="round">
      <path d="M 399 55 L 387 53"/>
      <path d="M 399 58 L 388 60"/>
      <path d="M 429 55 L 441 53"/>
      <path d="M 429 58 L 440 60"/>
    </g>
    <rect x="396" y="48" width="13" height="11" rx="5.5" fill="#fab387"/>
    <rect x="419" y="48" width="13" height="11" rx="5.5" fill="#fab387"/>
    <g stroke="#e79a6f" stroke-width="1.2" stroke-linecap="round">
      <path d="M 401 50 V 54"/>
      <path d="M 404.5 50 V 54"/>
      <path d="M 424 50 V 54"/>
      <path d="M 427.5 50 V 54"/>
    </g>
  </g>
  <!-- wordmark -->
  <text x="240" y="289" text-anchor="middle" font-size="55" font-weight="bold" letter-spacing="-2" fill="#cdd6f4">rootle</text>
</svg>
